<!doctype html>
<!-- A poetry book as the centerpiece: moss binding, gold type, ivory pages. The cover uses Times New Roman, no illustration, and the retained fleuron. Poetry is imported verbatim; only relevant artwork appears inside. -->
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e7e3d7"><meta name="description" content="Selected Poems by Sara Kim — an illustrated collection of ten poems."><link rel="canonical" href="https://sarakim23.vercel.app/"><title>Selected Poems · Sara Kim</title></head><body>
<header class="toolbar"><button id="contents">Contents</button><button id="reading-toggle" aria-pressed="false">Reading view</button></header>
<main><h1 class="sr-only">Selected Poems by Sara Kim</h1>
<section id="experience" aria-label="Interactive poetry book"><div class="stage"><div class="book-position closed" id="book-position"><div id="book" tabindex="0" role="group" aria-label="Poetry book. Drag a corner or use the left and right arrow keys to turn pages."></div></div></div><p class="gesture" id="gesture">Pull the cover’s lower corner to begin</p><span id="page-status" class="sr-only" role="status" aria-live="polite"></span></section>
<section id="reading-view" hidden aria-label="Plain reading view"></section>
<noscript><p>Enable JavaScript to open the book and use its plain reading view.</p></noscript></main><script type="module" src="/src/main.js"></script></body></html>
